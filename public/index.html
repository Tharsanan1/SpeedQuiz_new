<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed Quiz</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="wrap narrow">
  <h1 class="logo">⚡ Speed Quiz</h1>
  <p class="tagline">Real-time multiplayer quiz. No installs, no accounts.</p>

  <section class="card">
    <h2>Create Game</h2>
    <p class="muted">You become the host <em>and</em> a player.</p>
    <label class="field">
      <span>Your display name</span>
      <input id="create-name" maxlength="20" autocomplete="nickname" placeholder="e.g. QuizMaster">
    </label>
    <button id="create-btn" class="btn primary big">Create Game</button>
  </section>

  <section class="card">
    <h2>Join Game</h2>
    <label class="field">
      <span>Room code (4 letters)</span>
      <input id="join-room" maxlength="4" autocomplete="off" placeholder="ABCD" class="room-input">
    </label>
    <label class="field">
      <span>Your display name</span>
      <input id="join-name" maxlength="20" autocomplete="nickname" placeholder="e.g. Ravi">
    </label>
    <button id="join-btn" class="btn big">Join Game</button>
  </section>

  <p id="landing-error" class="error" hidden></p>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var prefill = (params.get('room') || '').toUpperCase().slice(0, 4);
  if (prefill) document.getElementById('join-room').value = prefill;

  var socket = io(); // relative URL: works behind tunnels/proxies
  var err = document.getElementById('landing-error');
  function showError(m) { err.textContent = m; err.hidden = false; }
  function clearError() { err.hidden = true; }
  function busy(btn, on) { btn.disabled = on; btn.classList.toggle('busy', on); }

  document.getElementById('create-btn').addEventListener('click', function () {
    clearError();
    var name = document.getElementById('create-name').value.trim();
    if (!name) return showError('Enter a display name first.');
    var btn = this; busy(btn, true);
    socket.emit('create-room', { name: name }, function (res) {
      busy(btn, false);
      if (!res || !res.ok) return showError((res && res.error) || 'Could not create room.');
      storeCreds(res.room, res.token, name);
      location.href = 'host.html?room=' + encodeURIComponent(res.room);
    });
  });

  document.getElementById('join-btn').addEventListener('click', function () {
    clearError();
    var room = document.getElementById('join-room').value.trim().toUpperCase();
    var name = document.getElementById('join-name').value.trim();
    if (!/^[A-Z]{4}$/.test(room)) return showError('Room code must be 4 letters.');
    if (!name) return showError('Enter a display name first.');
    var btn = this; busy(btn, true);
    socket.emit('join-room', { room: room, name: name }, function (res) {
      busy(btn, false);
      if (!res || !res.ok) return showError((res && res.error) || 'Could not join room.');
      storeCreds(res.room, res.token, name);
      location.href = 'player.html?room=' + encodeURIComponent(res.room);
    });
  });

  function storeCreds(room, token, name) {
    try {
      localStorage.setItem('sq_' + room + '_token', token);
      localStorage.setItem('sq_' + room + '_name', name);
    } catch (e) { /* private mode etc. */ }
  }
})();
</script>
</body>
</html>
